<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>脉冲回廊 · PULSE RUNNER</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #05000e; overflow: hidden; }
  body { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: #e8f6ff; user-select: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #vig { position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 52%, rgba(10,0,24,.55) 100%); }
  body.od #vig { background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 44%, rgba(140,40,255,.5) 100%);
    animation: odPulse .9s ease-in-out infinite alternate; }
  @keyframes odPulse { from { opacity: .68; } to { opacity: 1; } }
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 2; opacity: 0; }
  #fx.hit { background: radial-gradient(ellipse at 50% 50%, transparent 38%, rgba(255,36,80,.5) 100%);
    animation: fxFlash .38s ease-out; }
  #fx.gate { background: radial-gradient(ellipse at 50% 50%, rgba(150,240,255,.32), transparent 72%);
    animation: fxFlash .32s ease-out; }
  #fx.od { background: radial-gradient(ellipse at 50% 50%, rgba(255,233,92,.22), transparent 70%);
    animation: fxFlash .55s ease-out; }
  @keyframes fxFlash { 0% { opacity: 1; } 100% { opacity: 0; } }
  #hud { position: fixed; top: 14px; left: 18px; pointer-events: none; text-shadow: 0 0 12px rgba(0,240,255,.8); z-index: 3; }
  #hud .score { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .06em; }
  #hud .combo { font-size: 15px; color: #ffe95c; text-shadow: 0 0 10px rgba(255,233,92,.9); height: 20px; }
  #sectorTag { font-size: 11px; letter-spacing: .3em; color: rgba(143,176,255,.8); margin-top: 2px; }
  #shield { position: fixed; top: 16px; right: 66px; display: flex; gap: 7px; pointer-events: none; z-index: 3; }
  #shield i { width: 26px; height: 9px; background: rgba(0,240,255,.16); border: 1px solid rgba(0,240,255,.5); border-radius: 5px; box-shadow: 0 0 8px rgba(0,240,255,.35); }
  #shield i.on { background: #00f0ff; box-shadow: 0 0 14px #00f0ff; }
  #speed { position: fixed; bottom: 12px; left: 18px; font-size: 12px; letter-spacing: .3em; color: rgba(232,246,255,.55); pointer-events: none; z-index: 3; }
  #msg { position: fixed; top: 34%; width: 100%; text-align: center; font-size: 22px; letter-spacing: .4em;
    color: #ffe95c; text-shadow: 0 0 18px rgba(255,233,92,.9); opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 3; }
  #announce { position: fixed; top: 26%; width: 100%; text-align: center; font-size: clamp(26px, 5vw, 44px); font-weight: 800;
    letter-spacing: .3em; color: #b96bff; text-shadow: 0 0 30px rgba(185,107,255,.95); opacity: 0; pointer-events: none; z-index: 3; }
  #announce.show { animation: ann 2.2s ease forwards; }
  @keyframes ann {
    0% { opacity: 0; transform: scale(1.25); letter-spacing: .6em; }
    18% { opacity: 1; transform: scale(1); letter-spacing: .3em; }
    72% { opacity: 1; }
    100% { opacity: 0; transform: scale(.96); }
  }
  #btnPause { position: fixed; top: 12px; right: 14px; z-index: 5; width: 40px; height: 40px; cursor: pointer;
    border: 1px solid rgba(0,240,255,.4); border-radius: 10px; background: rgba(5,10,30,.5); color: #7fe9ff;
    font-size: 15px; line-height: 1; backdrop-filter: blur(4px); display: none; }
  body.playing #btnPause { display: block; }
  #btnPause:hover { background: rgba(0,240,255,.14); }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 42%, rgba(30,0,60,.86), rgba(2,0,10,.96) 72%); z-index: 10;
    transition: opacity .7s; }
  #overlay.hide { opacity: 0; pointer-events: none; }
  #overlay .kicker { font-size: 11px; letter-spacing: .7em; color: #7f6aff; margin-bottom: 8px; }
  #overlay h1 { font-size: clamp(40px, 11vw, 72px); font-weight: 800; letter-spacing: .1em;
    background: linear-gradient(100deg, #00f0ff 10%, #b96bff 45%, #ff4fd8 80%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 24px rgba(150,80,255,.65)); }
  #overlay .sub { margin: 8px 0 4px; font-size: 13px; letter-spacing: .4em; color: rgba(232,246,255,.75); }
  #overlay .keys { margin: 16px 0 26px; font-size: 12.5px; line-height: 2.1; color: rgba(232,246,255,.55); text-align: center; }
  #titleBest { font-size: 12px; letter-spacing: .25em; color: #ffe95c; opacity: .85; margin-bottom: 20px; min-height: 16px; }
  .btn-main { font: inherit; font-size: 17px; font-weight: 700; letter-spacing: .4em; cursor: pointer;
    padding: 14px 46px; color: #05000e; border: none; border-radius: 999px;
    background: linear-gradient(96deg, #00f0ff, #b96bff);
    box-shadow: 0 0 28px rgba(120,80,255,.75), 0 4px 0 rgba(0,0,0,.4); }
  .btn-main:active { transform: translateY(2px); }
  .hint { margin-top: 14px; font-size: 11px; letter-spacing: .2em; color: rgba(232,246,255,.35); }
  #pause { position: fixed; inset: 0; z-index: 12; display: flex; align-items: center; justify-content: center;
    background: rgba(2,0,12,.78); backdrop-filter: blur(10px); opacity: 0; pointer-events: none; transition: opacity .3s; }
  #pause.show { opacity: 1; pointer-events: auto; }
  #pause .panel { min-width: min(340px, 86vw); padding: 34px 38px 30px; border-radius: 18px; text-align: center;
    border: 1px solid rgba(0,240,255,.28); background: linear-gradient(160deg, rgba(20,8,50,.92), rgba(6,2,20,.94));
    box-shadow: 0 0 60px rgba(120,60,255,.35); }
  #pause h2 { font-size: 20px; font-weight: 800; letter-spacing: .5em; color: #7fe9ff; text-shadow: 0 0 18px rgba(0,240,255,.8); margin-bottom: 22px; }
  #pause button { display: block; width: 100%; margin: 10px 0; font: inherit; font-size: 14px; font-weight: 700;
    letter-spacing: .35em; cursor: pointer; padding: 12px 0; color: #d9f6ff;
    border: 1px solid rgba(0,240,255,.35); border-radius: 12px; background: rgba(0,240,255,.07); transition: background .2s; }
  #pause button:hover { background: rgba(0,240,255,.18); }
  #pause .vol { margin-top: 20px; text-align: left; }
  #pause .vol label { font-size: 11px; letter-spacing: .3em; color: rgba(232,246,255,.6); display: block; margin-bottom: 8px; }
  #pause input[type=range] { width: 100%; accent-color: #00f0ff; cursor: pointer; }
  #death { position: fixed; inset: 0; z-index: 11; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 45%, rgba(70,0,30,.9), rgba(2,0,6,.97) 75%); opacity: 0; pointer-events: none; transition: opacity .9s; }
  #death.show { opacity: 1; pointer-events: auto; }
  #death h2 { font-size: 30px; font-weight: 800; letter-spacing: .3em; color: #ff4f8f; text-shadow: 0 0 26px rgba(255,79,143,.8); margin-bottom: 8px; }
  #death .big { font-size: 54px; font-weight: 800; font-variant-numeric: tabular-nums;
    background: linear-gradient(100deg, #ffe95c, #ff4fd8); -webkit-background-clip: text; background-clip: text; color: transparent; margin: 6px 0; }
  #death .best { font-size: 13px; letter-spacing: .2em; color: rgba(232,246,255,.55); margin-bottom: 14px; }
  #statLine { display: flex; gap: 22px; margin-bottom: 26px; font-size: 12px; letter-spacing: .12em; color: rgba(232,246,255,.5); flex-wrap: wrap; justify-content: center; }
  #statLine b { color: #7fe9ff; font-weight: 700; margin-left: 4px; }
  #death button { font: inherit; font-size: 16px; font-weight: 700; letter-spacing: .35em; cursor: pointer;
    padding: 13px 42px; color: #05000e; border: none; border-radius: 999px;
    background: linear-gradient(96deg, #ffe95c, #ff4f8f); box-shadow: 0 0 24px rgba(255,120,90,.6); }
  #touch { position: fixed; inset: 0; z-index: 4; display: none; }
  @media (pointer: coarse) { #touch { display: block; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="fx"></div>
<div id="hud"><div class="score" id="score">0</div><div class="combo" id="combo"></div><div id="sectorTag"></div></div>
<div id="shield"><i class="on"></i><i class="on"></i><i class="on"></i></div>
<button id="btnPause" title="暂停 (ESC)">▮▮</button>
<div id="speed">×1.0</div>
<div id="msg"></div>
<div id="announce"></div>
<div id="touch"></div>
<div id="overlay" class="overlay">
  <div class="kicker">— PULSE RUNNER —</div>
  <h1>脉冲回廊</h1>
  <p class="sub">跟着节拍 · 别碰红色 · 收集同调</p>
  <p class="keys">A / D 或 ← → 切换三车道 · 空格 跃过矮障 · ESC 暂停<br>手机：左右半区点击移动，上滑跳<br>每 800 米穿越一道区段门 · 连击满 20 触发过载</p>
  <div id="titleBest"></div>
  <button id="btnStart" class="btn-main">进 入 隧 道</button>
  <div class="hint">SPACE / ENTER 也可以开始</div>
</div>
<div id="pause">
  <div class="panel">
    <h2>信号保持</h2>
    <button id="btnResume">继 续 滑 行</button>
    <button id="btnRestart">重 新 开 始</button>
    <button id="btnQuit">回 到 标 题</button>
    <div class="vol">
      <label>主音量</label>
      <input type="range" id="vol" min="0" max="1" step="0.01">
    </div>
  </div>
</div>
<div id="death" class="overlay">
  <h2>信号中断</h2>
  <div class="big" id="finalScore">0</div>
  <div class="best" id="bestLine">最佳 0</div>
  <div id="statLine"></div>
  <button id="btnAgain">再 冲 一 次</button>
</div>
<script src="js/vendor/three.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
